name: Publish container image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version to publish (for example, 1.0.0)
        required: false
        type: string
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_SHA" ] && [ "$source_sha" != "$EXPECTED_SHA" ]; then
            echo "main moved since the release workflow ran" >&2
            exit 1
          fi

          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            version="$(git tag --points-at "$source_sha" \
              | sed -n 's/^v//p' \
              | head -n 1)"
          fi

          {
            echo 'tags<<EOF'
            echo "${IMAGE}:latest"
            echo "${IMAGE}:sha-${source_sha}"
            if [ -n "$version" ]; then
              echo "${IMAGE}:${version}"
            fi
            echo EOF
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
