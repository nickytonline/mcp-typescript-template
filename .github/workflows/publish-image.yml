name: Publish container image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version to publish (for example, 1.0.0)
        required: false
        type: string
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Build the commit Release validated. The main branch can move while
          # that workflow is still running, and checking it out drops the image.
          ref: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha ||
            (inputs.version != '' && format('v{0}', inputs.version) || github.ref) }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          VERSION_INPUT: ${{ inputs.version }}
        run: node scripts/determine-image-tags.mts

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Update latest tag
        if: steps.tags.outputs.update_latest == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tip="$(git rev-parse origin/main)"
          if [ "$tip" != "${{ steps.tags.outputs.source_sha }}" ]; then
            echo "main is ${tip}; leaving ${IMAGE}:latest unchanged"
            exit 0
          fi
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${{ steps.push.outputs.digest }}"
