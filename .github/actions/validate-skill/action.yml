name: Validate Agent Skills
description: Validate each bundled Agent Skill and verify the npm package contains the same bytes.

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.26.x"

    - name: Validate Agent Skills
      shell: bash
      run: |
        shopt -s nullglob
        skills=(skills/*/)
        if [ ${#skills[@]} -eq 0 ]; then
          echo "No skill directories under skills/; skipping validation"
          exit 0
        fi
        for skill in "${skills[@]}"; do
          # skills-ref v0.0.1, pinned to the commit so the tag cannot move.
          go run github.com/skills-repos/agentskills/skills-ref/cmd/skills-ref@1d429a6bcb1fb2d01db42d37aedabc2edea46e39 validate "${skill%/}"
        done

    - name: Verify packaged skills
      shell: bash
      run: npm run verify:skill-package
